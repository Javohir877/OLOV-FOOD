<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPUS FOOD — Boshqaruv paneli</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0C0A09">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- ===== KIRISH ===== -->
  <section class="login" id="login">
    <form class="login__box" id="loginForm">
      <div class="login__logo">🍔</div>
      <h1>OPUS <span>Admin</span></h1>
      <p>Boshqaruv paneliga kirish uchun parolni kiriting</p>
      <label class="field">
        <span>Parol</span>
        <input type="password" id="loginPass" autocomplete="current-password" required>
      </label>
      <p class="login__err" id="loginErr"></p>
      <button class="btn btn--fire btn--block" type="submit">Kirish →</button>
      <a class="login__back" href="index.html">← Saytga qaytish</a>
    </form>
  </section>

  <!-- ===== PANEL ===== -->
  <div class="app" id="app" hidden>
    <aside class="side">
      <a class="side__brand" href="#dashboard">
        <span class="side__logo">🍔</span>
        <span>OPUS<b>FOOD</b><small>Boshqaruv</small></span>
      </a>
      <nav class="side__nav" id="sideNav">
        <a href="#dashboard" data-page="dashboard"><i>📊</i><span>Dashboard</span></a>
        <a href="#orders" data-page="orders"><i>🧾</i><span>Buyurtmalar</span><b class="side__badge" id="newBadge" hidden>0</b></a>
        <a href="#menu" data-page="menu"><i>🍔</i><span>Menyu</span></a>
        <a href="#promos" data-page="promos"><i>🎟</i><span>Promokodlar</span></a>
        <a href="#settings" data-page="settings"><i>⚙️</i><span>Sozlamalar</span></a>
      </nav>
      <div class="side__foot">
        <a href="index.html" target="_blank" rel="noopener">↗ Saytni ochish</a>
        <button id="logoutBtn">⎋ Chiqish</button>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSub"></p>
        </div>
        <div class="top__right">
          <span class="live"><i></i> Jonli</span>
          <span class="top__date" id="topDate"></span>
        </div>
      </header>
      <div class="page" id="page"></div>
    </main>
  </div>

  <!-- O'ng panel (buyurtma tafsiloti) -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>

  <!-- Oyna (taom tahriri) -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal__box" id="modalBox"></div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
